name: Neon English iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "README.md"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iPhone app
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Build unsigned iPhone app
        run: >-
          xcodebuild
          -project ios/NeonEnglish.xcodeproj
          -scheme NeonEnglish
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/NeonEnglishDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify launch screen, app icon, and device family
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/NeonEnglishDerivedData/Build/Products/Release-iphoneos/NeonEnglish.app"
          PLIST="$APP_PATH/Info.plist"
          test -d "$APP_PATH"

          LAUNCH_COLOR="$(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIColorName' "$PLIST")"
          ICON_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$PLIST")"
          DEVICE_FAMILY="$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$PLIST")"
          test "$LAUNCH_COLOR" = "LaunchBackground"
          test "$ICON_NAME" = "AppIcon"
          test "$DEVICE_FAMILY" = "1"
          if /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:1' "$PLIST" >/dev/null 2>&1; then
            echo "The app unexpectedly includes the iPad device family." >&2
            exit 1
          fi

          {
            echo "### iPhone package metadata"
            echo "- Launch screen: $LAUNCH_COLOR"
            echo "- App icon: $ICON_NAME"
            echo "- Device family: iPhone"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/NeonEnglishDerivedData/Build/Products/Release-iphoneos/NeonEnglish.app"
          IPA_ROOT="$RUNNER_TEMP/NeonEnglishUnsigned"
          test -d "$APP_PATH"
          mkdir -p "$IPA_ROOT/Payload"
          ditto "$APP_PATH" "$IPA_ROOT/Payload/NeonEnglish.app"
          (cd "$IPA_ROOT" && /usr/bin/zip -qry "$RUNNER_TEMP/NeonEnglish-unsigned.ipa" Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: neon-english-ios-unsigned-ipa
          path: ${{ runner.temp }}/NeonEnglish-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Check device-signing configuration
        id: signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Device signing is skipped for pull requests." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$IOS_CERTIFICATE_BASE64" && -n "$IOS_CERTIFICATE_PASSWORD" && -n "$IOS_PROVISIONING_PROFILE_BASE64" && -n "$IOS_TEAM_ID" && ( "$IOS_EXPORT_METHOD" == "development" || "$IOS_EXPORT_METHOD" == "ad-hoc" ) ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Device signing secrets are configured; a signed IPA will be exported." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No complete device-signing configuration is available. The unsigned IPA is build-only and cannot be installed directly on an iPhone." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install signing certificate and provisioning profile
        if: steps.signing.outputs.configured == 'true'
        id: install-signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/neon-english-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/ios-signing-certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios-provisioning-profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/ios-provisioning-profile.plist"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")"
          PROFILE_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIRECTORY"
          cp "$PROFILE_PATH" "$PROFILE_DIRECTORY/$PROFILE_UUID.mobileprovision"

          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Archive signed iPhone app
        if: steps.signing.outputs.configured == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
          PROFILE_NAME: ${{ steps.install-signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          if [[ "$IOS_EXPORT_METHOD" == "development" ]]; then
            SIGNING_IDENTITY="Apple Development"
          else
            SIGNING_IDENTITY="Apple Distribution"
          fi

          xcodebuild archive \
            -project ios/NeonEnglish.xcodeproj \
            -scheme NeonEnglish \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NeonEnglish.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGNING_ALLOWED=YES

      - name: Export signed IPA
        if: steps.signing.outputs.configured == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
          PROFILE_NAME: ${{ steps.install-signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/NeonEnglish-ExportOptions.plist"
          plutil -create xml1 "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :method string $IOS_EXPORT_METHOD" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $IOS_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.neonenglish.app string $PROFILE_NAME" "$EXPORT_OPTIONS"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NeonEnglish.xcarchive" \
            -exportPath "$RUNNER_TEMP/NeonEnglishSignedExport" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

      - name: Upload signed IPA
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: neon-english-ios-signed-ipa
          path: ${{ runner.temp }}/NeonEnglishSignedExport/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing keychain
        if: always() && steps.install-signing.outputs.keychain_path != ''
        env:
          KEYCHAIN_PATH: ${{ steps.install-signing.outputs.keychain_path }}
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
